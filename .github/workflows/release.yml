name: Build Release

on:
    workflow_dispatch:
        inputs:
            package:
                description: Package to release
                required: true
                type: choice
                default: com.erallie.stage-amplifier
                options:
                    - com.erallie.stage-amplifier
                    - com.erallie.minimal-amplifier

permissions:
    contents: write

concurrency:
    group: release-${{ inputs.package }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            PACKAGE_NAME: ${{ inputs.package }}
            GH_TOKEN: ${{ github.token }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Read package information
              shell: bash
              run: |
                  set -euo pipefail

                  packagePath="Packages/$PACKAGE_NAME"
                  manifest="$packagePath/package.json"

                  actualName=$(jq -er '.name' "$manifest")
                  version=$(jq -er '.version' "$manifest")
                  displayName=$(jq -er '.displayName' "$manifest")

                  if [ "$actualName" != "$PACKAGE_NAME" ]; then
                      echo "::error::Package folder and manifest name do not match."
                      exit 1
                  fi

                  # Preserve the existing Stage Amplifier tag format.
                  # Minimal Amplifier uses its own prefix to avoid collisions.
                  if [ "$PACKAGE_NAME" = "com.erallie.stage-amplifier" ]; then
                      releaseTag="$version"
                  else
                      releaseTag="$PACKAGE_NAME-$version"
                  fi

                  echo "packagePath=$packagePath" >> "$GITHUB_ENV"
                  echo "version=$version" >> "$GITHUB_ENV"
                  echo "displayName=$displayName" >> "$GITHUB_ENV"
                  echo "releaseTag=$releaseTag" >> "$GITHUB_ENV"
                  echo "zipFile=$PACKAGE_NAME-$version.zip" >> "$GITHUB_ENV"
                  echo "unityPackage=$PACKAGE_NAME-$version.unitypackage" >> "$GITHUB_ENV"

            - name: Check whether version is already released
              shell: bash
              run: |
                  set -euo pipefail

                  if gh release view "$releaseTag" \
                      --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
                  then
                      echo "::error::This version is already released. Increase the selected package's version in package.json."
                      exit 1
                  fi

            - name: Copy documentation into both packages
              shell: bash
              run: |
                  set -euo pipefail

                  for package in \
                      "Packages/com.erallie.stage-amplifier" \
                      "Packages/com.erallie.minimal-amplifier"
                  do
                      cp README.md "$package/README.md"
                      cp LICENSE.md "$package/LICENSE.md"
                  done

            - name: Create Package Zip
              shell: bash
              run: |
                  set -euo pipefail

                  cd "$packagePath"
                  zip -r "$GITHUB_WORKSPACE/$zipFile" .

            - name: Track Package Meta Files
              shell: bash
              run: |
                  set -euo pipefail

                  find "$packagePath/" -name '*.meta' > metaList

            - name: Create UnityPackage
              uses: pCYSl5EDgo/create-unitypackage@v1.2.3
              with:
                  package-path: ${{ env.unityPackage }}
                  include-files: metaList

            - name: Publish Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.releaseTag }}
                  target_commitish: ${{ github.sha }}
                  name: ${{ env.displayName }} ${{ env.version }}
                  fail_on_unmatched_files: true
                  files: |
                      ${{ env.zipFile }}
                      ${{ env.unityPackage }}
                      ${{ env.packagePath }}/package.json

    update-listing:
        name: Trigger VCC listing rebuild
        needs: build
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Dispatch listing workflow
              env:
                  GH_TOKEN: ${{ secrets.VCC_LISTING_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail

                  if [ -z "$GH_TOKEN" ]; then
                      echo "::error::Add the VCC_LISTING_TOKEN repository secret with Actions write access to Erallie/vcc-listing."
                      exit 1
                  fi

                  gh workflow run build-listing.yml \
                      --repo Erallie/vcc-listing \
                      --ref main
